name: Deploy app and website to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      RAILWAY_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: cloudpeak-railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SirArthur2009/cloudpeak-app
          ref: main
          path: cloudpeak-app
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SirArthur2009/cloudpeak-web
          ref: main
          path: cloudpeak-web
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: cloudpeak-app/package-lock.json
      - name: Install and check deployment
        working-directory: cloudpeak-app
        run: |
          npm ci
          npm run test:deployment
      - name: Build both frontends without private credentials
        working-directory: cloudpeak-app
        env:
          HOSTED_BUILD_MODE: live
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run prepare:railway
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.63.1
      - name: Deploy and verify the exact app and website revisions
        working-directory: cloudpeak-app
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node deployment/deploy-ci.mjs
