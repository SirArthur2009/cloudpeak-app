name: Deploy independent website to Railway
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      RAILWAY_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: cloudpeak-website-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SirArthur2009/cloudpeak-app
          ref: main
          path: cloudpeak-app
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SirArthur2009/cloudpeak-web
          ref: main
          path: cloudpeak-web
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.1'
      - name: Test isolation and prepare website
        working-directory: cloudpeak-app
        run: |
          node --test deployment/gateway.test.mjs deployment/website/isolation.test.mjs
          node scripts/prepare-website.mjs
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.63.1
      - name: Deploy and verify website
        working-directory: cloudpeak-app
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          WEBSITE_RAILWAY_SERVICE_ID: ${{ vars.WEBSITE_RAILWAY_SERVICE_ID }}
          WEBSITE_VERIFY_ORIGIN: ${{ vars.WEBSITE_VERIFY_ORIGIN }}
        run: node deployment/website/deploy-ci.mjs
