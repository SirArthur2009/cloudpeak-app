[functions.receive-inbound-email]
enabled = true
# Called by Resend's inbound email webhook, not by our own frontend, so it
# must not require a Supabase user JWT. The function verifies the request
# using Resend's own webhook signature instead (RESEND_WEBHOOK_SECRET).
verify_jwt = false
entrypoint = "./functions/receive-inbound-email/index.ts"

[functions.send-email-reply]
enabled = true
